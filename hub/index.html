<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1118" />
<title>SIGNAL — optical party games</title>
<style>
  :root{
    --bg:#0f1118; --bg2:#0b0d13; --text:#f3f5fb; --dim:#9aa0b4;
    --blue:#4f8cff; --pink:#ff5c8a; --teal:#37e0b0; --amber:#ffb84d; --violet:#9b7bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(79,140,255,.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,92,138,.16), transparent 55%),
      var(--bg);
    color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:22px 18px 30px;max-width:620px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
  .mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:900;color:#08131f;
    background:linear-gradient(135deg,var(--teal),#1f9d7d);box-shadow:0 8px 22px rgba(55,224,176,.35);}
  .title{font-size:26px;font-weight:900;letter-spacing:.02em;margin:0;}
  .title small{display:block;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:3px;}
  .top .settings{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid #23283a;background:#161927;color:var(--dim);font-size:18px;display:grid;place-items:center;}

  .lead{font-size:13px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:0 2px 12px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tile{
    position:relative;display:flex;flex-direction:column;justify-content:space-between;
    aspect-ratio:1/1;border-radius:24px;padding:18px;text-decoration:none;color:#0b0f1a;
    box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .12s ease, filter .12s ease; overflow:hidden;
  }
  .tile:active{transform:scale(.965);}
  .tile .ico{font-size:46px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));}
  .tile .name{font-size:22px;font-weight:900;letter-spacing:.01em;}
  .tile .desc{font-size:12.5px;font-weight:600;opacity:.72;margin-top:2px;}
  .tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
    background:rgba(255,255,255,.22);}
  .t-walkie{background:linear-gradient(155deg,#7db0ff,var(--blue));}
  .t-reveal{background:linear-gradient(155deg,#ff8fb0,var(--pink));}
  .t-phrase{background:linear-gradient(155deg,#69ecc6,var(--teal));}
  .t-soon{background:linear-gradient(155deg,#3a3f52,#2a2e3d);color:#8b90a3;box-shadow:0 8px 20px rgba(0,0,0,.3);pointer-events:none;}
  .t-soon .lock{position:absolute;top:16px;right:16px;font-size:16px;opacity:.8;}
  .t-party{background:linear-gradient(155deg,#b49dff,#7b5bff);color:#120a24;}
  .party-wide{grid-column:1 / -1;aspect-ratio:auto;flex-direction:row;align-items:center;gap:16px;padding:20px 22px;}
  .party-wide .ico{font-size:40px;}

  .foot{margin-top:auto;padding-top:24px;text-align:center;color:#5b6072;font-size:11px;letter-spacing:.08em;}
  .foot b{color:var(--dim);font-weight:700;}
</style>
</head>
<body>
  <div class="top">
    <div class="mark">◇</div>
    <h1 class="title">SIGNAL<small>optical party games</small></h1>
    <div class="settings" aria-hidden="true">?</div>
  </div>

  <p class="lead">Play together</p>
  <div class="grid">
    <a class="tile t-party party-wide" href="../party/">
      <span class="ico">🎉</span>
      <span><span class="name">Party up</span><span class="desc">a room with names &amp; scores</span></span>
    </a>
  </div>

  <p class="lead" style="margin-top:16px">Pick a game</p>
  <div class="grid">
    <a class="tile t-walkie" href="../walkie/">
      <span class="ico">💬</span>
      <span><span class="name">Walkie</span><span class="desc">talk phone-to-phone in light</span></span>
    </a>
    <a class="tile t-reveal" href="../fragments/">
      <span class="ico">🖼️</span>
      <span><span class="name">Reveal</span><span class="desc">guess the mystery image</span></span>
    </a>
    <a class="tile t-phrase" href="../sentence/">
      <span class="ico">🔤</span>
      <span><span class="name">Phrase</span><span class="desc">read it before it fills in</span></span>
    </a>
    <span class="tile t-soon">
      <span class="lock">🔒</span>
      <span class="ico">🎭</span>
      <span><span class="name">More</span><span class="desc">coming soon</span></span>
    </span>
  </div>

  <div class="foot"><b>no accounts · no network · light only</b></div>
</body>
</html>
