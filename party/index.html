<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f1118" />
<title>Party — SIGNAL</title>
<style>
  :root{
    --bg:#0f1118; --card:#171a24; --card2:#1d212e; --border:#272c3b;
    --text:#f3f5fb; --dim:#9aa0b4; --faint:#666c80;
    --accent:#9b7bff; --accent2:#7b5bff; --green:#37e0b0; --gold:#ffb84d; --red:#e2554b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{background:radial-gradient(900px 520px at 50% -8%, rgba(155,123,255,.2), transparent 60%), var(--bg);
    color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:18px 16px 28px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .hide{display:none !important;}

  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
  .brand .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#120a24;
    background:linear-gradient(135deg,#b49dff,var(--accent));box-shadow:0 6px 16px rgba(155,123,255,.35);}
  .brand h1{font-size:16px;letter-spacing:.16em;margin:0;font-weight:800;}
  .brand .back{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);}

  .hero{display:flex;align-items:center;gap:12px;}
  .hero .emoji{font-size:32px;}
  .hero h2{margin:0;font-size:22px;font-weight:900;}
  .hero p{margin:2px 0 0;font-size:12.5px;color:var(--dim);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.32);}
  label{display:block;font-size:12px;color:var(--dim);margin:2px 0 7px;font-weight:600;}
  input{width:100%;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:14px;padding:14px;font-size:17px;font-weight:600;}
  input:focus{outline:none;border-color:var(--accent2);}
  .btn{width:100%;padding:16px;font-size:17px;font-weight:900;border:0;border-radius:16px;margin-top:14px;letter-spacing:.03em;transition:transform .06s;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:linear-gradient(180deg,#b49dff,var(--accent2));color:#120a24;box-shadow:0 10px 24px rgba(155,123,255,.3);}
  .btn.go{background:linear-gradient(180deg,#5fe9c6,#1f9d7d);color:#06231a;box-shadow:0 10px 24px rgba(55,224,176,.3);}
  .btn.ghost{background:transparent;border:2px solid var(--border);color:var(--dim);box-shadow:none;}
  .btn:disabled{opacity:.4;}

  .or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 10px;}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--border);}
  .joinrow{display:flex;gap:10px;}
  .joinrow input{text-transform:uppercase;letter-spacing:.24em;text-align:center;font-weight:900;}
  .joinrow .btn{margin-top:0;width:auto;padding:14px 22px;}

  .roomrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .roomrow .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:800;}
  .code{font-size:30px;font-weight:900;letter-spacing:.28em;color:var(--accent);}
  .qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px;}
  #qr{width:min(58vw,220px);height:min(58vw,220px);background:#fff;border-radius:14px;padding:10px;image-rendering:pixelated;}
  .qrhint{font-size:12px;color:var(--faint);}

  .players .plab{font-size:12px;color:var(--dim);font-weight:700;margin:4px 2px 10px;}
  .roster{display:flex;flex-direction:column;gap:8px;}
  .prow{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:14px;background:var(--bg);}
  .prow .av{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#120a24;background:linear-gradient(135deg,#b49dff,var(--accent));}
  .prow .nm{font-weight:800;}
  .prow .tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);}
  .prow .tag.ready{color:var(--green);}

  .status{font-size:12.5px;color:var(--dim);text-align:center;min-height:16px;}
  .foot{text-align:center;font-size:10px;color:var(--faint);letter-spacing:.06em;padding:6px 0;}
</style>
</head>
<body>
  <a class="brand" href="../">
    <span class="logo">◇</span>
    <h1>SIGNAL</h1>
    <span class="back">‹ home</span>
  </a>
  <div class="hero">
    <span class="emoji">🎉</span>
    <div><h2>Party</h2><p id="heroSub">Start a room or join with a code.</p></div>
  </div>

  <!-- LANDING: create or join-by-code (visible by default) -->
  <div id="landing" class="card">
    <button id="createBtn" class="btn primary">Create a room</button>
    <div class="or">or join</div>
    <label>Enter a room code</label>
    <div class="joinrow">
      <input id="codeInput" placeholder="CODE" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" />
      <button id="codeJoinBtn" class="btn go">Join</button>
    </div>
    <div class="status" id="landingStatus" style="margin-top:10px"></div>
  </div>

  <!-- NAME GATE -->
  <div id="nameGate" class="card hide">
    <label id="nameLabel">What should we call you?</label>
    <input id="nameInput" placeholder="Your name" autocapitalize="words" maxlength="16" />
    <button id="joinBtn" class="btn primary">Enter lobby</button>
    <div class="status" id="gateStatus" style="margin-top:10px"></div>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="hide">
    <div class="card" id="qrCard">
      <div class="roomrow"><span class="lab">Room</span><span class="code" id="codeText">····</span></div>
      <div class="qrwrap">
        <canvas id="qr" width="220" height="220"></canvas>
        <div class="qrhint">Scan to join the room</div>
      </div>
    </div>

    <div class="card players">
      <div class="plab" id="plab">Players</div>
      <div class="roster" id="roster"></div>
    </div>

    <button id="readyBtn" class="btn go hide">✓ Ready — start</button>
    <div class="status" id="lobbyStatus"></div>
  </div>

  <div class="foot">the scoreboard rides the network · the game still rides light</div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
