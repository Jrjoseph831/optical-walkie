<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d13" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="SIGNAL" />
<title>Leaderboard — SIGNAL</title>
<style>
  :root{
    --bg:#0b0d13; --text:#f4f6fb; --dim:#a2a8bc; --faint:#6b7186;
    --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
    --stroke:rgba(255,255,255,.08); --stroke2:rgba(255,255,255,.16);
    --gold:#ffb84d; --teal:#37e0b0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    background:radial-gradient(1000px 540px at 50% -10%, rgba(255,184,77,.09), transparent 60%), var(--bg);
    color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:calc(18px + env(safe-area-inset-top)) 18px 30px;max-width:560px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;gap:16px;-webkit-font-smoothing:antialiased;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
  .brand .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#06231a;
    background:linear-gradient(135deg,#69ecc6,#1f9d7d);box-shadow:0 6px 16px rgba(55,224,176,.3);}
  .brand h1{font-size:15px;letter-spacing:.22em;margin:0;font-weight:800;}
  .brand .back{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);}

  .hero{display:flex;align-items:center;gap:13px;margin:2px 2px 0;}
  .hero .emoji{font-size:34px;filter:drop-shadow(0 4px 10px rgba(255,184,77,.35));}
  .hero h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em;}
  .hero p{margin:2px 0 0;font-size:12.5px;color:var(--dim);}

  .tabs{display:flex;gap:8px;}
  .tab{flex:1;padding:11px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);color:var(--dim);
    font:inherit;font-size:13px;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:.15s;}
  .tab.on{color:#2b1a04;background:linear-gradient(180deg,#ffd08a,#e09a2f);border-color:transparent;
    box-shadow:0 8px 20px rgba(255,184,77,.25);}
  .tab:disabled{opacity:.45;cursor:default;}

  .board{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;padding:8px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 14px 36px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.06);}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:17px;}
  .row + .row{margin-top:2px;}
  .row .rk{width:30px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums;color:var(--faint);font-size:14px;}
  .row.p1 .rk,.row.p2 .rk,.row.p3 .rk{font-size:17px;}
  .row .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--glass2);flex:0 0 auto;}
  .row .nm{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .nm small{display:block;font-weight:600;font-size:10.5px;color:var(--faint);}
  .row .sc{font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold);font-size:16px;}
  .row.p1{background:linear-gradient(90deg, rgba(255,184,77,.14), transparent 75%);}
  .row.me{outline:2px solid rgba(55,224,176,.5);outline-offset:-2px;background:rgba(55,224,176,.07);}
  .row.me .nm::after{content:" · you";color:var(--teal);font-size:11px;font-weight:800;}

  .state{padding:44px 20px;text-align:center;color:var(--dim);font-size:13.5px;}
  .state .big{font-size:34px;display:block;margin-bottom:10px;}
  .cta{display:block;text-align:center;text-decoration:none;margin-top:2px;padding:16px;border-radius:16px;font-size:15px;font-weight:900;color:#06231a;
    background:linear-gradient(180deg,#69ecc6,#1f9d7d);box-shadow:0 10px 24px rgba(55,224,176,.26);transition:transform .08s;}
  .cta:active{transform:scale(.98);}
  .foot{margin-top:auto;text-align:center;font-size:10px;color:var(--faint);letter-spacing:.06em;padding:8px 0 2px;}
</style>
</head>
<body>
  <a class="brand" href="../">
    <span class="logo">◇</span>
    <h1>SIGNAL</h1>
    <span class="back">‹ home</span>
  </a>

  <div class="hero">
    <span class="emoji">🏆</span>
    <div><h2>Leaderboard</h2><p>Best solo runs, worldwide. One entry per player.</p></div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabPhrase">Phrase</button>
    <button class="tab" id="tabReveal" disabled>Reveal · soon</button>
  </div>

  <div class="board" id="board">
    <div class="state" id="state"><span class="big">📡</span>Tuning in…</div>
  </div>

  <a class="cta" href="../sentence/">▶ &nbsp;Post a run — play Phrase</a>

  <div class="foot">solo runs only · party rooms keep their own score</div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
