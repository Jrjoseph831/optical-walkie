<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d13" />
<title>Walkie — SIGNAL</title>
<style>
  :root{
    --bg:#0b0d13; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08); --border:rgba(255,255,255,.09);
    --text:#f4f6fb; --dim:#a2a8bc; --faint:#6b7186;
    --accent:#4f8cff; --accent2:#3a6fe0; --gold:#ffb84d; --red:#e2554b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{background:radial-gradient(900px 520px at 50% -8%, rgba(79,140,255,.18), transparent 60%), var(--bg);
    color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;gap:12px;padding:16px;max-width:560px;margin:0 auto;min-height:100vh;}

  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
  .brand .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#06101f;
    background:linear-gradient(135deg,#7db0ff,var(--accent));box-shadow:0 6px 16px rgba(79,140,255,.35);}
  .brand h1{font-size:16px;letter-spacing:.16em;margin:0;font-weight:800;}
  .brand .back{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);}
  .hero{display:flex;align-items:center;gap:12px;}
  .hero .emoji{font-size:30px;}
  .hero h2{margin:0;font-size:20px;font-weight:900;}
  .hero p{margin:2px 0 0;font-size:12px;color:var(--dim);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;
    backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 14px 36px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.06);}
  .bar{display:flex;gap:10px;align-items:center;}
  .bar input{flex:1;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:12px;padding:12px;font-weight:600;}
  .bar input:focus{outline:none;border-color:var(--accent2);}
  .status{font-size:11.5px;color:var(--dim);min-height:14px;padding:0 2px;}

  .top{display:flex;gap:10px;}
  .log{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:10px;overflow-y:auto;max-height:26vh;min-height:70px;}
  .log .peer{background:#12233f;border:1px solid #23406e;border-radius:12px;padding:8px 10px;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;}
  .log .me{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;opacity:.8;}
  .log .who{font-size:9px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-bottom:3px;font-weight:700;}
  video{width:92px;height:124px;object-fit:cover;border-radius:12px;background:#000;border:1px solid var(--border);}

  .compose{display:flex;gap:10px;}
  .compose input{flex:1;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:14px;padding:13px;font-size:16px;font-weight:600;}
  .compose input:focus{outline:none;border-color:var(--accent2);}
  .tx{border:0;border-radius:14px;font-weight:900;font-size:15px;padding:0 20px;letter-spacing:.03em;transition:transform .06s;
    background:linear-gradient(180deg,#7db0ff,var(--accent2));color:#06101f;box-shadow:0 8px 20px rgba(79,140,255,.3);}
  .tx:active{transform:scale(.97);}
  #camBtn{padding:12px 18px;}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;min-height:38vh;box-shadow:0 10px 28px rgba(0,0,0,.3);}
  #bb{image-rendering:pixelated;width:min(78vw,420px);height:min(78vw,420px);background:#fff;border-radius:14px;}
  #bb.idle{display:none;}
  .idlemsg{color:var(--dim);text-align:center;font-size:13px;padding:20px;max-width:90%;}
  .idlemsg b{color:var(--accent);}
  .caption{font-size:11.5px;color:var(--faint);text-align:center;max-width:92%;word-break:break-word;}
  .caption b{color:var(--gold);}
  canvas.work{display:none;}
  .foot{text-align:center;font-size:10px;color:var(--faint);letter-spacing:.06em;padding:2px 0 4px;}
</style>
</head>
<body>
  <a class="brand" href="../">
    <span class="logo">◇</span>
    <h1>SIGNAL</h1>
    <span class="back">‹ home</span>
  </a>
  <div class="hero">
    <span class="emoji">💬</span>
    <div><h2>Walkie</h2><p>Talk phone-to-phone in light — no network.</p></div>
  </div>

  <div class="card">
    <div class="bar">
      <input id="key" value="lab" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="shared key (both must match)" />
      <button id="camBtn" class="tx">Camera</button>
    </div>
  </div>
  <div class="status" id="status">Enter a shared key, start the camera, and point it at the other phone's code.</div>

  <div class="top">
    <div class="log" id="log"></div>
    <video id="video" playsinline muted></video>
  </div>

  <div class="compose">
    <input id="msg" placeholder="Type a message…" />
    <button id="txBtn" class="tx">Send ▶</button>
  </div>

  <div class="stage">
    <div class="idlemsg" id="idle">Nothing broadcasting yet.<br />Type a message and hit <b>Send</b> — your screen becomes the code the other camera reads.</div>
    <canvas id="bb" class="idle" width="460" height="460"></canvas>
    <div class="caption" id="caption"></div>
  </div>

  <div class="foot">no accounts · no network · light only</div>

  <canvas id="work" class="work"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
