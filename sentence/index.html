<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f1118" />
<title>Phrase — SIGNAL</title>
<style>
  :root{
    --bg:#0f1118; --card:#171a24; --card2:#1d212e; --border:#272c3b;
    --text:#f3f5fb; --dim:#9aa0b4; --faint:#666c80;
    --teal:#37e0b0; --teal2:#1f9d7d; --gold:#ffb84d; --red:#e2554b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    background:radial-gradient(900px 520px at 50% -8%, rgba(55,224,176,.18), transparent 60%), var(--bg);
    color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:18px 16px 28px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  }
  .hide{display:none !important;}

  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
  .brand .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#08131f;
    background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 6px 16px rgba(55,224,176,.35);}
  .brand h1{font-size:16px;letter-spacing:.16em;margin:0;font-weight:800;}
  .brand .back{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);}

  .hero{display:flex;align-items:center;gap:12px;padding:4px 2px;}
  .hero .emoji{font-size:34px;}
  .hero h2{margin:0;font-size:22px;font-weight:900;}
  .hero p{margin:2px 0 0;font-size:12.5px;color:var(--dim);}

  /* Role picker — two big cards */
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .rolecard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
    padding:18px;border-radius:20px;border:2px solid var(--border);background:var(--card);color:var(--text);
    transition:transform .1s, border-color .12s, box-shadow .12s;}
  .rolecard:active{transform:scale(.97);}
  .rolecard .ri{font-size:30px;}
  .rolecard b{font-size:18px;font-weight:900;}
  .rolecard small{font-size:11.5px;color:var(--dim);font-weight:600;}
  .rolecard.active{border-color:var(--teal);box-shadow:0 0 0 4px rgba(55,224,176,.15),0 12px 28px rgba(0,0,0,.35);background:var(--card2);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.32);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .panel-head h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:800;}
  .hud{display:flex;align-items:center;gap:8px;}
  .pill{font-size:11px;font-weight:800;color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:6px 11px;white-space:nowrap;}
  .pill.mono{font-variant-numeric:tabular-nums;}

  label{display:block;font-size:12px;color:var(--dim);margin:2px 0 7px;font-weight:600;}
  select,input{width:100%;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:14px;padding:13px;font-size:16px;font-weight:600;}
  select:focus,input:focus{outline:none;border-color:var(--teal2);}

  .btn{width:100%;padding:16px;font-size:17px;font-weight:900;border:0;border-radius:16px;margin-top:14px;letter-spacing:.03em;transition:transform .06s;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:linear-gradient(180deg,var(--teal),var(--teal2));color:#06231a;box-shadow:0 10px 24px rgba(55,224,176,.3);}
  .btn.stop{background:linear-gradient(180deg,#ef6a60,var(--red));color:#fff;box-shadow:0 10px 24px rgba(226,85,75,.28);}
  .btn.ghost{background:transparent;border:2px solid var(--border);color:var(--dim);box-shadow:none;}

  .transmitter{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .tx-frame{position:relative;padding:14px;border-radius:22px;background:#0b0d13;border:1px solid var(--border);}
  .tx-frame::before{content:"";position:absolute;inset:-2px;border-radius:22px;padding:2px;
    background:linear-gradient(135deg,var(--teal),transparent 45%,transparent 55%,var(--teal));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:glow 3s ease-in-out infinite;pointer-events:none;}
  @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
  #bb{image-rendering:pixelated;width:min(72vw,340px);height:min(72vw,340px);background:#fff;border-radius:12px;display:block;}
  .tx-caption{font-size:12px;color:var(--faint);text-align:center;}

  .signal{width:14px;height:14px;border-radius:50%;background:#2a2e3c;transition:.1s;}
  .signal.hit{background:var(--gold);box-shadow:0 0 12px var(--gold);}
  .screen{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;
    background:#0a0c12;border:1px solid var(--border);border-radius:16px;padding:16px;min-height:96px;
    box-shadow:inset 0 2px 22px rgba(0,0,0,.55);color:var(--faint);font-size:13px;text-align:center;}
  .wc{image-rendering:pixelated;border-radius:5px;background:#0a0b10;box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .wc.now{outline:2px solid var(--gold);outline-offset:2px;}
  .status{font-size:12.5px;color:var(--dim);min-height:16px;margin-top:10px;text-align:center;}
  .result{font-size:17px;font-weight:900;text-align:center;padding:6px;min-height:8px;}
  .win{color:var(--teal);} .lose{color:var(--red);}

  video{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;top:0;left:0;}
  canvas.work{display:none;}
  .foot{text-align:center;font-size:10px;color:var(--faint);letter-spacing:.06em;padding:2px 0 6px;}

  /* ---------- immersive states ---------- */
  body.playing .brand,body.playing .hero,body.playing .roles,body.playing .foot,body.playing #beaconCard{display:none;}
  body.playing #playerCard{position:fixed;inset:0;margin:0;border:0;border-radius:0;padding:22px;box-shadow:none;
    background:radial-gradient(1000px 540px at 50% -8%, rgba(55,224,176,.12), var(--bg) 62%);display:flex;flex-direction:column;}
  body.playing .panel-head,body.playing .status,body.playing #camBtn,body.playing #newBtn{display:none;}
  body.playing #words{flex:1;border:0;background:transparent;box-shadow:none;align-content:center;padding:6px;gap:12px 16px;}
  body.playing .wc{height:58px;width:auto;}
  body.playing #answerWrap{margin:0;padding-top:14px;border-top:1px solid var(--border);display:flex;gap:12px;align-items:center;}
  body.playing #guess{background:transparent;border:0;border-radius:0;font-size:18px;padding:14px 2px;}
  body.playing #guessBtn{width:auto;margin:0;padding:14px 26px;border-radius:999px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;}

  body.result .brand,body.result .hero,body.result .roles,body.result .foot,body.result #beaconCard,
  body.result .panel-head,body.result #words,body.result #answerWrap,body.result .status,body.result #camBtn{display:none;}
  body.result #playerCard{position:fixed;inset:0;margin:0;border:0;border-radius:0;padding:32px;box-shadow:none;
    background:radial-gradient(900px 540px at 50% 0%, rgba(55,224,176,.14), var(--bg) 62%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
  body.result #result{font-size:26px;line-height:1.45;max-width:340px;}
  body.result #newBtn{display:block;max-width:240px;margin:0;}

  body.casting .brand,body.casting .hero,body.casting .roles,body.casting .foot,body.casting #playerCard{display:none;}
  body.casting #beaconCard{position:fixed;inset:0;margin:0;border:0;border-radius:0;padding:24px;box-shadow:none;
    background:radial-gradient(900px 540px at 50% -8%, rgba(55,224,176,.14), var(--bg) 62%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
  body.casting label,body.casting #puzzle,body.casting .panel-head{display:none;}
  body.casting #bb{width:min(82vw,440px);height:min(82vw,440px);}
  body.casting #bcnBtn{position:fixed;left:22px;right:22px;bottom:22px;width:auto;margin:0;}
</style>
</head>
<body>
  <a class="brand" href="../">
    <span class="logo">◇</span>
    <h1>SIGNAL</h1>
    <span class="back">‹ home</span>
  </a>

  <div class="hero">
    <span class="emoji">🔤</span>
    <div><h2>Phrase</h2><p>Read the phrase before it fills in.</p></div>
  </div>

  <div class="roles">
    <button id="roleBeacon" class="rolecard"><span class="ri">📡</span><b>Beacon</b><small>show the code</small></button>
    <button id="rolePlayer" class="rolecard"><span class="ri">🔍</span><b>Player</b><small>guess the phrase</small></button>
  </div>

  <!-- BEACON -->
  <section id="beaconCard" class="panel hide">
    <div class="panel-head"><h3>Beacon</h3><span class="pill" id="bcnStat" hidden></span></div>
    <select id="puzzle" hidden></select>
    <button id="bcnBtn" class="btn primary">Start</button>
    <div class="transmitter">
      <div class="tx-frame"><canvas id="bb" width="440" height="440"></canvas></div>
      <div class="tx-caption">Players point their phones here</div>
    </div>
  </section>

  <!-- PLAYER -->
  <section id="playerCard" class="panel hide">
    <div class="panel-head">
      <h3>Player</h3>
      <div class="hud">
        <span class="signal" id="dot"></span>
        <span class="pill" id="count">0% revealed</span>
        <span class="pill mono" id="timer">0:00</span>
      </div>
    </div>
    <div class="screen" id="words">Tap Start, then aim at the beacon.</div>
    <div class="status" id="plStat"></div>
    <button id="camBtn" class="btn primary">Start</button>
    <div id="answerWrap" class="hide" style="margin-top:12px">
      <input id="guess" placeholder="Guess the phrase…" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button id="guessBtn" class="btn primary">Guess</button>
    </div>
    <div id="result" class="result"></div>
    <button id="newBtn" class="btn ghost">New game</button>
  </section>

  <div class="foot">no accounts · no network · light only</div>

  <video id="video" playsinline muted></video>
  <canvas id="work" class="work"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
