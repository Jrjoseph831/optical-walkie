<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a0b10" />
<title>SIGNAL — Guess the Phrase</title>
<style>
  :root{
    --bg:#0a0b10; --bg2:#0e1017; --card:#14161f; --card2:#181b26;
    --border:#262a38; --text:#eef0f6; --dim:#8b90a3; --faint:#5b6072;
    --accent:#37e0b0; --accent2:#2bb894; --gold:#efb043; --red:#e2554b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #141826 0%, var(--bg) 55%);
    color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:12px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  }
  .hide{display:none !important;}

  /* Brand */
  .brand{display:flex;align-items:center;gap:10px;padding:2px 2px 0;}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#1f8f74);
    display:grid;place-items:center;color:#04150f;font-weight:900;box-shadow:0 0 18px rgba(55,224,176,.35);}
  .brand h1{font-size:17px;letter-spacing:.14em;margin:0;font-weight:800;}
  .brand .tag{margin-left:auto;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}

  /* Segmented role control */
  .seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px;gap:5px;}
  .seg button{flex:1;padding:12px;font-size:15px;font-weight:700;border:0;border-radius:10px;background:transparent;color:var(--dim);transition:.15s;}
  .seg button.active{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04),0 6px 18px rgba(0,0,0,.35);}
  .seg button.active#roleBeacon{color:var(--accent);}
  .seg button.active#rolePlayer{color:var(--gold);}

  /* Panels */
  .panel{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .panel-head h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:700;}
  .hud{display:flex;align-items:center;gap:8px;}
  .pill{font-size:11px;font-weight:700;color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:5px 10px;white-space:nowrap;}
  .pill.mono{font-variant-numeric:tabular-nums;}

  label{display:block;font-size:11px;color:var(--dim);margin:2px 0 6px;letter-spacing:.03em;}
  select,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:12px;font-size:15px;}
  select:focus,input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(55,224,176,.15);}

  .btn{width:100%;padding:15px;font-size:16px;font-weight:800;border:0;border-radius:13px;margin-top:12px;letter-spacing:.02em;transition:transform .06s;}
  .btn:active{transform:scale(.985);}
  .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#04150f;box-shadow:0 8px 22px rgba(55,224,176,.25);}
  .btn.stop{background:linear-gradient(180deg,#ef6a60,var(--red));color:#fff;box-shadow:0 8px 22px rgba(226,85,75,.25);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--dim);box-shadow:none;}

  /* Beacon transmitter */
  .transmitter{margin-top:14px;display:flex;flex-direction:column;align-items:center;}
  .tx-frame{position:relative;padding:14px;border-radius:20px;background:linear-gradient(180deg,#0c0e15,#0a0b10);border:1px solid var(--border);}
  .tx-frame::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;
    background:linear-gradient(135deg,rgba(55,224,176,.6),transparent 40%,transparent 60%,rgba(55,224,176,.6));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:glow 3s ease-in-out infinite;pointer-events:none;}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
  #bb{image-rendering:pixelated;width:min(70vw,340px);height:min(70vw,340px);background:#fff;border-radius:10px;display:block;}
  .tx-caption{margin-top:12px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px;}
  .tx-caption::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.4s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* Player decoder */
  .signal{width:14px;height:14px;border-radius:50%;background:#2a2e3c;transition:.1s;}
  .signal.hit{background:var(--gold);box-shadow:0 0 12px var(--gold);}
  .screen{display:flex;flex-wrap:wrap;gap:9px 12px;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#07080c,#0b0d14);border:1px solid var(--border);border-radius:14px;
    padding:16px;min-height:96px;box-shadow:inset 0 2px 20px rgba(0,0,0,.6);color:var(--faint);font-size:13px;text-align:center;}
  .wc{image-rendering:pixelated;border-radius:4px;background:#0a0b10;box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .wc.now{outline:2px solid var(--gold);outline-offset:2px;}
  .status{font-size:12.5px;color:var(--dim);min-height:16px;margin-top:10px;text-align:center;}
  .guessrow{margin-top:12px;}
  .result{font-size:17px;font-weight:800;text-align:center;padding:6px;min-height:8px;}
  .win{color:var(--accent);} .lose{color:var(--red);}

  video{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;top:0;left:0;}
  canvas.work{display:none;}
  .foot{text-align:center;font-size:10px;color:var(--faint);letter-spacing:.05em;padding:4px 0 8px;}
</style>
</head>
<body>
  <header class="brand">
    <span class="logo">◉</span>
    <h1>SIGNAL</h1>
    <span class="tag">optical party game</span>
  </header>

  <div class="seg" role="tablist">
    <button id="roleBeacon">📡 Beacon</button>
    <button id="rolePlayer">🔍 Player</button>
  </div>

  <!-- BEACON -->
  <section id="beaconCard" class="panel hide">
    <div class="panel-head"><h2>Broadcast Console</h2><span class="pill" id="bcnStat">Idle</span></div>
    <label>Choose a phrase</label>
    <select id="puzzle"></select>
    <button id="bcnBtn" class="btn primary">Start broadcasting</button>
    <div class="transmitter">
      <div class="tx-frame"><canvas id="bb" width="440" height="440"></canvas></div>
      <div class="tx-caption">Players point their phones here</div>
    </div>
  </section>

  <!-- PLAYER -->
  <section id="playerCard" class="panel hide">
    <div class="panel-head">
      <h2>Decoder</h2>
      <div class="hud">
        <span class="signal" id="dot"></span>
        <span class="pill" id="count">0% revealed</span>
        <span class="pill mono" id="timer">0:00</span>
      </div>
    </div>
    <div class="screen" id="words">Start scanning and aim at the beacon.</div>
    <div class="status" id="plStat"></div>
    <button id="camBtn" class="btn primary">Start scanning</button>
    <div id="answerWrap" class="hide guessrow">
      <input id="guess" placeholder="Guess the phrase…" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button id="guessBtn" class="btn primary">Guess</button>
    </div>
    <div id="result" class="result"></div>
    <button id="newBtn" class="btn ghost">New game</button>
  </section>

  <div class="foot">no accounts · no network · light only</div>

  <video id="video" playsinline muted></video>
  <canvas id="work" class="work"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
